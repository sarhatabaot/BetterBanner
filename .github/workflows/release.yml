# Builds the shaded plugin jar for a manually-created GitHub Release,
# uploads that jar to the same release, and (optionally) publishes the
# same file to Modrinth.
#
# Required secrets (only used by the Modrinth step, currently disabled):
#   MODRINTH_TOKEN       - https://modrinth.com/settings/pats (scope: versions:write)
#   MODRINTH_PROJECT_ID  - the Modrinth project id (slug or numeric id)
#
# To enable Modrinth publishing later, uncomment the entire "Publish to
# Modrinth" step below and add the two secrets above to the repository.

name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build, attach asset, and publish to Modrinth
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build shaded jar
        run: ./gradlew shadowJar

      - name: Resolve release artifacts
        id: release_meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'BetterBanner-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "No built jar found in build/libs" >&2
            exit 1
          fi

          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload jar to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: ${{ steps.release_meta.outputs.jar_path }}

      # ------------------------------------------------------------------------
      # Modrinth publishing is intentionally disabled. Uncomment this entire
      # step when the project has a Modrinth listing, and make sure the
      # MODRINTH_TOKEN and MODRINTH_PROJECT_ID secrets are configured.
