# Per-tier pattern caps for the loom.
#
# Permission nodes:
#   betterbanner.basic        — up to `basic` layers
#   betterbanner.intermediate — up to `intermediate` layers
#   betterbanner.advanced     — up to `advanced` layers
#   betterbanner.unlimited    — no cap
#
# The `default` cap applies to players with no BetterBanner permission.
# Values are clamped so each tier is at least as high as the previous one.
#
default: 6
basic: 8
intermediate: 11
advanced: 15

# Set to true to disable bStats metrics.
disable-metrics: false
